name: Check the Mayura website
description: Install the website lockfile, typecheck, build, and validate the prerendered pages.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.14.1
    - shell: bash
      run: npm install --global pnpm@10.17.1 --ignore-scripts
    - shell: bash
      working-directory: site
      run: pnpm install --frozen-lockfile --ignore-scripts
    - shell: bash
      working-directory: site
      run: pnpm typecheck
    - shell: bash
      working-directory: site
      run: pnpm build && pnpm check
