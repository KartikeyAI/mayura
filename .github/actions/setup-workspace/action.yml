name: Set up Mayura workspace
description: Install pinned Node and pnpm versions with the frozen workspace lockfile and lifecycle scripts disabled.
inputs:
  node-version:
    description: Exact Node version used by this qualification lane.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      run: npm install --global pnpm@10.17.1 --ignore-scripts
    - shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
