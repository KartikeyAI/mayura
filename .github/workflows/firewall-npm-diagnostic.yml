name: Firewall npm resolution diagnostic
on:
  push:
    branches: [feat/firewall-for-agents-dvar]
permissions:
  contents: read
jobs:
  npm-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Dvar public registry version
        shell: bash
        run: |
          set +e
          npm view @rokadhq/dvar@0.7.0 version --registry=https://registry.npmjs.org
          result=$?
          echo "NPM_VERSION_LOOKUP_EXIT_CODE=$result"
          exit 0
      - run: |
          npm install --global pnpm@10.17.1 --ignore-scripts
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Capture generated lockfile changes
        run: |
          git diff -- pnpm-lock.yaml
