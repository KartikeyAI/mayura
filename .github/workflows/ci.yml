name: Mayura qualification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: mayura-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.23.2, 24.14.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- node scripts/secret-scan.mjs
      - run: node scripts/ci-step.mjs -- pnpm typecheck
      - run: node scripts/ci-step.mjs -- pnpm console:check
      - run: node scripts/ci-step.mjs -- pnpm test
      - run: node scripts/ci-step.mjs -- pnpm test:consumer
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:optional
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:storage
      - run: node scripts/ci-step.mjs -- pnpm example
      - run: node scripts/ci-step.mjs -- node examples/agent-orchestration.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-composition.mjs
      - run: node scripts/ci-step.mjs -- node examples/local-server.mjs
      - run: node scripts/ci-step.mjs -- node examples/embedded-handler.mjs
      - run: node scripts/ci-step.mjs -- node packages/workflows/examples/scheduled-workflow.mjs
      - run: node scripts/ci-step.mjs -- node examples/managed-guardrails.mjs
      - run: node scripts/ci-step.mjs -- node examples/lifecycle-hooks.mjs
      - run: node scripts/ci-step.mjs -- node examples/execution-completion-waits.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-waits.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-discovery.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-coordinator.mjs
      - run: node scripts/ci-step.mjs -- node examples/durable-budgets.mjs
      - run: node scripts/ci-step.mjs -- pnpm test:templates
      - run: node scripts/ci-step.mjs -- pnpm test:starters
      - run: node scripts/ci-step.mjs -- node scripts/provider-live-check.mjs --dry-run
      - run: node scripts/ci-step.mjs -- pnpm api:report
      - run: node scripts/ci-step.mjs -- node scripts/version.mjs check
      - run: node scripts/ci-step.mjs -- node scripts/workspace-facade.mjs --check
      - run: node scripts/ci-step.mjs -- pnpm test:bundle
      - run: node scripts/ci-step.mjs -- pnpm docs:check
      - run: node scripts/ci-step.mjs -- pnpm release:artifacts
      - run: node scripts/ci-step.mjs -- node scripts/sbom.mjs
  postgres:
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2, 24.14.1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: mayura
          POSTGRES_PASSWORD: mayura_ci_test_only
          POSTGRES_DB: mayura
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mayura"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAYURA_TEST_POSTGRES_URL: postgresql://mayura:mayura_ci_test_only@127.0.0.1:5432/mayura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm typecheck
      - run: node scripts/ci-step.mjs -- pnpm test:integration
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:storage
  # Entry points outside the Node-only list bundle for edge runtimes, and the runtime probe (agents, the server handler,
  # workflows, memory, storage) passes on Bun, Deno, Cloudflare's workerd without nodejs_compat and Vercel's Edge VM,
  # with every result equal to Node's.
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm build
      - run: node scripts/ci-step.mjs -- pnpm edge:check
      - run: node scripts/ci-step.mjs -- pnpm test:runtimes --require bun,deno,workerd,edge
  container:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm build
      - if: matrix.node == 24
        run: docker pull node:24.14.1-alpine@sha256:8510330d3eb72c804231a834b1a8ebb55cb3796c3e4431297a24d246b8add4d5
      - if: matrix.node == 22
        run: docker pull node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
      - run: docker pull postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
      - run: node scripts/ci-step.mjs -- node scripts/server-image.mjs --smoke --node ${{ matrix.node }}
