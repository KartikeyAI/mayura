name: Mayura qualification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: mayura-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.23.2, 24.14.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- node scripts/secret-scan.mjs
      - run: node scripts/ci-step.mjs -- pnpm typecheck
      - run: node scripts/ci-step.mjs -- pnpm console:check
      - run: node scripts/ci-step.mjs -- pnpm test
      - run: node scripts/ci-step.mjs -- pnpm test:consumer
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:optional
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:storage
      - run: node scripts/ci-step.mjs -- pnpm example
      - run: node scripts/ci-step.mjs -- node examples/agent-orchestration.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-composition.mjs
      - run: node scripts/ci-step.mjs -- node examples/local-server.mjs
      - run: node scripts/ci-step.mjs -- node examples/embedded-handler.mjs
      - run: node scripts/ci-step.mjs -- node packages/workflows/examples/scheduled-workflow.mjs
      - run: node scripts/ci-step.mjs -- node examples/managed-guardrails.mjs
      - run: node scripts/ci-step.mjs -- node examples/lifecycle-hooks.mjs
      - run: node scripts/ci-step.mjs -- node examples/execution-completion-waits.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-waits.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-discovery.mjs
      - run: node scripts/ci-step.mjs -- node examples/workflow-graph-coordinator.mjs
      - run: node scripts/ci-step.mjs -- node examples/durable-budgets.mjs
      - run: node scripts/ci-step.mjs -- pnpm test:templates
      - run: node scripts/ci-step.mjs -- pnpm test:starters
      - run: node scripts/ci-step.mjs -- node scripts/provider-live-check.mjs --dry-run
      - run: node scripts/ci-step.mjs -- pnpm api:report
      - run: node scripts/ci-step.mjs -- node scripts/version.mjs check
      - run: node scripts/ci-step.mjs -- node scripts/workspace-facade.mjs --check
      - run: node scripts/ci-step.mjs -- pnpm test:bundle
      - run: node scripts/ci-step.mjs -- pnpm docs:check
      - run: node scripts/ci-step.mjs -- pnpm release:artifacts
      - run: node scripts/ci-step.mjs -- node scripts/sbom.mjs
  postgres:
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2, 24.14.1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: mayura
          POSTGRES_PASSWORD: mayura_ci_test_only
          POSTGRES_DB: mayura
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mayura"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # A libSQL server (sqld v0.24.33, as Turso runs it) for @mayurajs/storage-libsql's integration tests.
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:f8ca0134cdded747793888e48591aece07647d9d598d3ac229aabfa93159ca88
        ports: [18080:8080]
      # MySQL 8.4 for @mayurajs/storage-mysql's integration tests.
      mysql:
        image: mysql@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: mayura_ci_test_only
        ports: [13306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmayura_ci_test_only"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # DynamoDB Local (in memory) for @mayurajs/storage-dynamodb's integration tests.
      dynamodb:
        image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports: [18000:8000]
      # RustFS, an S3-compatible server, for mayura/files' S3 integration tests (MinIO no longer publishes images).
      rustfs:
        image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: mayuratest
          RUSTFS_SECRET_KEY: mayura_ci_test_only
        ports: [19000:9000]
      # Azurite, Microsoft's Azure Storage emulator, for @mayurajs/filestorage-azure-blob's integration tests.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports: [10000:10000]
    env:
      MAYURA_TEST_POSTGRES_URL: postgresql://mayura:mayura_ci_test_only@127.0.0.1:5432/mayura
      MAYURA_TEST_LIBSQL_URL: ws://127.0.0.1:18080
      MAYURA_TEST_MYSQL_URL: mysql://root:mayura_ci_test_only@127.0.0.1:13306/mysql
      MAYURA_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MAYURA_TEST_DYNAMODB_URL: http://127.0.0.1:18000
      MAYURA_TEST_S3_URL: http://mayuratest:mayura_ci_test_only@127.0.0.1:19000
      MAYURA_TEST_GCS_URL: http://127.0.0.1:14443
      MAYURA_TEST_AZURITE_URL: http://127.0.0.1:10000/devstoreaccount1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm typecheck
      # A single-node MongoDB replica set (transactions need one) for @mayurajs/storage-mongodb. Service containers take no
      # command line, and MongoDB needs --replSet, so it is started here.
      - run: |
          docker run -d --name mongodb -p 127.0.0.1:27017:27017 mongo@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping')" && break; sleep 2; done
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in $(seq 1 30); do [ "$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      # fake-gcs-server needs command-line flags (plain HTTP), which service containers cannot take.
      - run: docker run -d -p 127.0.0.1:14443:4443 fsouza/fake-gcs-server@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef -scheme http -port 4443 -public-host 127.0.0.1:14443 && for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:14443/storage/v1/b > /dev/null && break; sleep 1; done
      - run: node scripts/ci-step.mjs -- pnpm test:integration
      - run: node scripts/ci-step.mjs -- pnpm test:consumer:storage
  # Entry points outside the Node-only list bundle for edge runtimes, and the runtime probe (agents, the server handler,
  # workflows, memory, storage) passes on Bun, Deno, Cloudflare's workerd without nodejs_compat and Vercel's Edge VM,
  # with every result equal to Node's.
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm build
      - run: node scripts/ci-step.mjs -- pnpm edge:check
      - run: node scripts/ci-step.mjs -- pnpm test:runtimes --require bun,deno,workerd,edge
  container:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci-step.mjs -- pnpm build
      - if: matrix.node == 24
        run: docker pull node:24.14.1-alpine@sha256:8510330d3eb72c804231a834b1a8ebb55cb3796c3e4431297a24d246b8add4d5
      - if: matrix.node == 22
        run: docker pull node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
      - run: docker pull postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
      - run: node scripts/ci-step.mjs -- node scripts/server-image.mjs --smoke --node ${{ matrix.node }}
