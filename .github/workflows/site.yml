name: Website
# Builds the website in site/ (the docs from docs/ plus the landing page) and deploys it to GitHub Pages from main.
# The Qualification workflow validates website changes on pull requests.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - extensions/ui/**
      - packages/cli/ui/**
      - scripts/docs-index.mjs
      - scripts/ui-registry.mjs
      - package.json
      - LICENSE
      - NOTICE
      - .github/actions/check-site/**
      - .github/workflows/site.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The base path and host come from the repository's Pages settings: "/" and mayurajs.com once the custom domain
      # is set, "/mayura" and kartikeyai.github.io until then. Links always use https: Pages serves every site over it,
      # while the origin output says http until "Enforce HTTPS" is on.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: ./.github/actions/check-site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.host && format('https://{0}', steps.pages.outputs.host) || 'https://mayurajs.com' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist/client
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
