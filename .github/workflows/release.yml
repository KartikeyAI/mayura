name: Mayura release
# Releases come from main only, and only from a commit that passed the full qualification workflow.
#   - After every successful qualification of a push to main, `plan` works out the next version from the commits since
#     the last v* tag (Conventional Commits: feat -> minor, fix/perf -> patch, breaking -> major). No release-worthy
#     commit, no release.
#   - The first release, or any explicit version, is started by hand from main (Actions > Mayura release > Run workflow).
# It publishes the single `mayura` package (scripts/bundle-package.mjs) to npm and attaches it to the GitHub Release.
# GitHub Packages is not used: its npm registry accepts only scoped packages, and `mayura` is unscoped.
# Nothing is published until the repository variable MAYURA_RELEASE is `enabled`; until then every run is a complete dry
# run. Publishing also waits for the protected `release` environment (configure required reviewers). See
# RELEASING.md.
on:
  workflow_run:
    workflows: ['Mayura qualification']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, such as 1.0.0 or 1.0.0-rc.1 (empty: work it out from the commits)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: mayura-release
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  plan:
    # A green qualification of a push to main in this repository, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ vars.MAYURA_RELEASE == 'enabled' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0 # tags and commits since the last release
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - id: next
        env:
          REQUESTED: ${{ inputs.version }}
        run: node scripts/version.mjs next --version "$REQUESTED"
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          REASON: ${{ steps.next.outputs.reason }}
          PUBLISH: ${{ vars.MAYURA_RELEASE == 'enabled' }}
        run: |
          if [ -z "$VERSION" ]; then echo "No release: $REASON" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = true ]; then echo "Releasing v$VERSION ($REASON)." >> "$GITHUB_STEP_SUMMARY"
          else echo "Dry run of v$VERSION ($REASON). Set the repository variable MAYURA_RELEASE=enabled to publish." >> "$GITHUB_STEP_SUMMARY"; fi

  dry-run:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/version.mjs set "$VERSION"
          pnpm build
          pnpm upgrade:compat
          pnpm release:artifacts
          node scripts/sbom.mjs
      - name: Publish (dry run)
        run: node scripts/publish-staged.mjs --tag ${{ needs.plan.outputs.tag }}
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/version.mjs notes "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the version commit, the tag and the GitHub Release
      id-token: write # npm provenance through OpenID Connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true # pushes the version commit and tag with this job's token
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/version.mjs set "$VERSION"
          pnpm build
          pnpm upgrade:compat
          pnpm release:artifacts
          node scripts/sbom.mjs
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # empty when npm trusted publishing is configured instead
        run: node scripts/publish-staged.mjs --tag ${{ needs.plan.outputs.tag }} --publish
      - name: Commit the version, tag it and push
        # Author and committer may differ: RELEASE_GIT_AUTHOR_* and RELEASE_GIT_COMMITTER_* (the committer also tags),
        # each falling back to RELEASE_GIT_NAME/RELEASE_GIT_EMAIL and then to github-actions[bot]. A step already done,
        # for a release that stopped part-way or was committed and tagged by hand, is skipped.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_GIT_COMMITTER_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_GIT_COMMITTER_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          git add -A -- package.json packages extensions compatibility scripts CHANGELOG.md
          committed=false
          if git diff --cached --quiet; then echo "The version $VERSION is already committed."
          else git commit -m "chore(release): v$VERSION [skip ci]"; committed=true; fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then echo "v$VERSION is already tagged."
          else git tag -a "v$VERSION" -m "Mayura $VERSION" && git push origin "v$VERSION"; fi
          # main may have moved on while this ran; replay the version commit on top of it.
          if [ "$committed" = true ]; then
            git push origin HEAD:main || { git fetch origin main && git rebase origin/main && git push origin HEAD:main; }
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/version.mjs notes "$VERSION" > release-notes.md
          staged=$(ls -d .artifacts/release-* | head -n 1)
          assets="$(ls "$staged"/tarballs/*.tgz) $staged/release-manifest.json $(ls .artifacts/sbom-*/sbom.cdx.json | head -n 1)"
          # A release that already exists (a resumed run) keeps its notes and gets its files attached again.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" $assets --clobber
          else
            gh release create "v$VERSION" --verify-tag --title "Mayura $VERSION" --notes-file release-notes.md \
              $([ "$TAG" = next ] && echo --prerelease) $assets
          fi
