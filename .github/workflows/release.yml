name: Mayura release
# Releases come from main only, and only from a commit that passed the full qualification workflow.
#   - After every successful qualification of a push to main, `plan` works out the next version from the commits since
#     the last v* tag (Conventional Commits: feat -> minor, fix/perf -> patch, breaking -> major). No release-worthy
#     commit, no release.
#   - The first release, or any explicit version, is started by hand from main (Actions > Mayura release > Run workflow).
# Full releases publish mayura and every extension from a reviewed version commit, then tag that exact commit.
# GitHub Packages is not used: its npm registry accepts only scoped packages, and `mayura` is unscoped.
# Nothing is published until the repository variable MAYURA_RELEASE is `enabled`; until then every run is a complete dry
# run. Publishing also waits for the protected `release` environment (configure required reviewers). See
# RELEASING.md.
on:
  workflow_run:
    workflows: ['Mayura qualification']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, such as 1.0.0 or 1.0.0-rc.1 (empty: work it out from the commits)'
        required: false
        default: ''
      package_set:
        description: 'all: normal release; prerelease-22: the reviewed 22-package RC set, preserving latest tags'
        type: choice
        options: [all, prerelease-22]
        default: all
      dry_run:
        description: 'Build and rehearse without publishing, even when publishing is enabled'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Scoped RCs have their own serialized queue; an old full-release approval cannot block their activation window.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.package_set == 'prerelease-22' && 'mayura-release-prerelease-22' || 'mayura-release' }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  plan:
    # A green qualification of a push to main in this repository, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.ready.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0 # tags and commits since the last release
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - id: next
        # Validate the explicit partial-release version before building any archives.
        # The publisher independently checks the same boundary before registry writes.
        env:
          REQUESTED: ${{ inputs.version }}
          PACKAGE_SET: ${{ inputs.package_set }}
        run: |
          if [ "$PACKAGE_SET" = prerelease-22 ] && ! [[ "$REQUESTED" =~ ^1\.2\.0-rc\.[1-9][0-9]*$ ]]; then
            echo 'The reviewed set requires an explicit 1.2.0-rc.N after rc.0.' >&2
            exit 1
          fi
          node scripts/version.mjs next --version "$REQUESTED"
      - id: ready
        name: Require a reviewed version commit for full publication
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PACKAGE_SET: ${{ inputs.package_set }}
          ENABLED: ${{ vars.MAYURA_RELEASE == 'enabled' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          current=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          publish=false
          if [ "$ENABLED" = true ] && [ "$DRY_RUN" != true ]; then
            if [ "$PACKAGE_SET" = prerelease-22 ] || [ "$current" = "$VERSION" ]; then
              publish=true
            else
              echo 'Version is not committed: this is a rehearsal. Merge and qualify a release version PR before publication.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          REASON: ${{ steps.next.outputs.reason }}
          PUBLISH: ${{ steps.ready.outputs.publish }}
        run: |
          if [ -z "$VERSION" ]; then echo "No release: $REASON" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = true ]; then echo "Releasing v$VERSION ($REASON)." >> "$GITHUB_STEP_SUMMARY"
          else echo "Dry run of v$VERSION ($REASON). Publication requires MAYURA_RELEASE=enabled, dry_run=false and a committed version for the full package set." >> "$GITHUB_STEP_SUMMARY"; fi

  dry-run:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/version.mjs set "$VERSION"
          pnpm build
          pnpm upgrade:compat
          pnpm release:artifacts
          node scripts/sbom.mjs
      - name: Publish (dry run)
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$PACKAGE_SET" = prerelease-22 ]; then
            manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json -print -quit)
            node scripts/publish-prerelease.mjs --manifest "$manifest" --version "$VERSION"
          else
            manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json -print -quit)
            node scripts/publish-staged.mjs --manifest "$manifest" --tag "$TAG"
          fi
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/version.mjs notes "$VERSION" | tee .artifacts/rehearsal-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve rehearsal archives and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-${{ needs.plan.outputs.version }}
          path: |
            .artifacts/release-*/release-manifest.json
            .artifacts/release-*/tarballs/*.tgz
            .artifacts/sbom-*/sbom.cdx.json
            .artifacts/rehearsal-notes.md
          retention-days: 7

  release:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish == 'true' && inputs.package_set != 'prerelease-22'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # Only the version tag and GitHub Release; version commits go through a reviewed PR.
      actions: read # Verify exact-main qualification and recover this run's immutable publication receipt.
      id-token: write # npm trusted publishing and provenance through OpenID Connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true # pushes only the version tag; never writes main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover this run's full-release archives and receipt
        id: recover
        if: github.run_attempt != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-all-${{ needs.plan.outputs.version }}
          path: .artifacts/full-release
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release-finalize.mjs --prepared "$VERSION"
          pnpm build
          pnpm upgrade:compat
          pnpm release:artifacts
          node scripts/sbom.mjs
          mkdir -p .artifacts/full-release
          if [ ! -f .artifacts/full-release/sbom.cdx.json ]; then
            cp "$(find .artifacts -maxdepth 2 -name sbom.cdx.json ! -path '.artifacts/full-release/*' -print -quit)" .artifacts/full-release/sbom.cdx.json
          fi
          if [ ! -f .artifacts/full-release/release-notes.md ]; then
            node scripts/version.mjs notes "$VERSION" > .artifacts/full-release/release-notes.md
          fi
      - name: Publish to npm
        # npm exchanges this job's OIDC identity for package-scoped credentials. No npm token secret is required.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json ! -path '.artifacts/full-release/*' -print -quit)
          node scripts/publish-staged.mjs --manifest "$manifest" --tag "$TAG" --publish
      - name: Tag the qualified version commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_GIT_COMMITTER_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_GIT_COMMITTER_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          node scripts/release-finalize.mjs --published "$VERSION"
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$SOURCE_SHA"
          else
            git tag -a "v$VERSION" -m "Mayura $VERSION"
          fi
          git push origin "refs/tags/v$VERSION"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/release-finalize.mjs --published "$VERSION"
          staged=.artifacts/full-release
          assets=("$staged"/tarballs/*.tgz "$staged/release-manifest.json" "$staged/sbom.cdx.json" "$staged/receipt.json" "$staged/qualification.json")
          # A release that already exists (a resumed run) keeps its notes and gets its files attached again.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            flags=()
            if [ "$TAG" = next ]; then flags+=(--prerelease); fi
            gh release create "v$VERSION" --verify-tag --title "Mayura $VERSION" --notes-file "$staged/release-notes.md" \
              "${flags[@]}" "${assets[@]}"
          fi
      - name: Preserve full-release evidence, including uncertain uploads
        # A failed/interrupted recovery must not replace the original evidence with a partial download.
        if: always() && (github.run_attempt == '1' || steps.recover.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-all-${{ needs.plan.outputs.version }}
          path: |
            .artifacts/full-release/release-manifest.json
            .artifacts/full-release/receipt.json
            .artifacts/full-release/qualification.json
            .artifacts/full-release/sbom.cdx.json
            .artifacts/full-release/release-notes.md
            .artifacts/full-release/tarballs/*.tgz
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  prerelease-22:
    name: Publish reviewed 22-package prerelease
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.package_set == 'prerelease-22' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      actions: read # Verify exact-main qualification and recover this run's receipt on retry.
      id-token: write # npm trusted publishing; no npm token secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0 # Upgrade compatibility needs the previous release tag and its tree.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover this run's immutable archives and receipt
        if: github.run_attempt != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prerelease-22-${{ needs.plan.outputs.version }}
          path: .artifacts/prerelease-22
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify prerelease archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/version.mjs set "$VERSION"
          pnpm build
          pnpm upgrade:compat
          pnpm release:artifacts
          node scripts/sbom.mjs
      - name: Publish the reviewed set through OIDC and verify latest tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json ! -path '.artifacts/prerelease-22/*' -print -quit)
          node scripts/publish-prerelease.mjs --manifest "$manifest" --version "$VERSION" --publish
      - name: Preserve archives and receipt, including uncertain uploads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-22-${{ needs.plan.outputs.version }}
          path: |
            .artifacts/prerelease-22/release-manifest.json
            .artifacts/prerelease-22/receipt.json
            .artifacts/prerelease-22/qualification.json
            .artifacts/prerelease-22/tarballs/*.tgz
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
