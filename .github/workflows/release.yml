name: Mayura release
# Normal releases publish a reviewed, committed package plan from qualified main.
# Archive checks still cover every package. Only the packages in the plan can be uploaded.
# Nothing is published until the repository variable MAYURA_RELEASE is `enabled`; until then every run is a complete dry
# run. Publishing also waits for the protected `release` environment (configure required reviewers). See
# RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Committed package plan ID (filename in release-plans/ without .json)'
        required: false
        default: ''
      version:
        description: 'Explicit coordinated version, used only for a legacy package set'
        required: false
        default: ''
      package_set:
        description: 'changed: publish the committed plan; other sets are legacy coordinated releases'
        type: choice
        options: [changed, all, prerelease-22]
        default: changed
      dry_run:
        description: 'Build and rehearse without publishing, even when publishing is enabled'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # Package sets may overlap, so serialize all registry writes through the same workflow group.
  group: mayura-release
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      path: ${{ steps.next.outputs.path }}
      artifact: ${{ steps.next.outputs.artifact }}
      publish: ${{ steps.ready.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0 # tags and commits since the last release
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - id: next
        # Validate the explicit partial-release version before building any archives.
        # The publisher independently checks the same boundary before registry writes.
        env:
          REQUESTED: ${{ inputs.version }}
          PACKAGE_SET: ${{ inputs.package_set }}
          PLAN_ID: ${{ inputs.plan }}
        run: |
          if [ "$PACKAGE_SET" = changed ]; then
            test -z "$REQUESTED"
            [[ "$PLAN_ID" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo 'Enter a committed package plan ID.' >&2; exit 1; }
            plan="release-plans/$PLAN_ID.json"
            node scripts/package-release-plan.mjs "$plan"
            printf 'path=%s\nversion=%s\nartifact=release-plan-%s\nreason=reviewed package plan\n' "$plan" "$PLAN_ID" "$PLAN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -z "$PLAN_ID"
          test -n "$REQUESTED"
          if [ "$PACKAGE_SET" = prerelease-22 ] && ! [[ "$REQUESTED" =~ ^1\.2\.0-rc\.[1-9][0-9]*$ ]]; then
            echo 'The reviewed set requires an explicit 1.2.0-rc.N after rc.0.' >&2
            exit 1
          fi
          node scripts/version.mjs next --version "$REQUESTED"
          printf 'artifact=release-all-%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"
      - id: ready
        name: Require a reviewed package plan or legacy version
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PACKAGE_SET: ${{ inputs.package_set }}
          ENABLED: ${{ vars.MAYURA_RELEASE == 'enabled' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          current=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          publish=false
          if [ "$ENABLED" = true ] && [ "$DRY_RUN" != true ]; then
            if [ "$PACKAGE_SET" = changed ] || [ "$PACKAGE_SET" = prerelease-22 ] || [ "$current" = "$VERSION" ]; then
              publish=true
            else
              echo 'Version is not committed: this is a rehearsal. Merge and qualify a release version PR before publication.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          REASON: ${{ steps.next.outputs.reason }}
          PUBLISH: ${{ steps.ready.outputs.publish }}
        run: |
          if [ -z "$VERSION" ]; then echo "No release: $REASON" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = true ]; then echo "Releasing $VERSION ($REASON)." >> "$GITHUB_STEP_SUMMARY"
          else echo "Dry run of $VERSION ($REASON). Publication requires MAYURA_RELEASE=enabled and dry_run=false." >> "$GITHUB_STEP_SUMMARY"; fi

  dry-run:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          artifact_args=()
          if [ -n "$PLAN" ]; then
            node scripts/release-finalize.mjs --prepared-plan "$PLAN"
          else
            node scripts/version.mjs set "$VERSION" --lockstep
            artifact_args+=(--legacy-lockstep)
          fi
          pnpm build
          node scripts/secret-scan.mjs
          pnpm upgrade:compat --fetch-baseline
          pnpm release:artifacts "${artifact_args[@]}"
          node scripts/sbom.mjs
      - name: Publish (dry run)
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json -print -quit)
          if [ "$PACKAGE_SET" = prerelease-22 ]; then
            node scripts/publish-prerelease.mjs --manifest "$manifest" --version "$VERSION"
          elif [ -n "$PLAN" ]; then
            node scripts/publish-staged.mjs --manifest "$manifest" --plan "$PLAN" --tag "$TAG"
            node scripts/registry-release-check.mjs --manifest .artifacts/full-release/release-manifest.json --plan "$PLAN" --staged
          else
            node scripts/publish-staged.mjs --manifest "$manifest" --tag "$TAG"
          fi
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          if [ -n "$PLAN" ]; then
            node --input-type=module -e 'import {readReleasePlan} from "./scripts/package-release-plan.mjs"; console.log(readReleasePlan(process.argv[1]).plan.notes)' "$PLAN" > .artifacts/rehearsal-notes.md
          else
            node scripts/version.mjs notes "$VERSION" > .artifacts/rehearsal-notes.md
          fi
          cat .artifacts/rehearsal-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve rehearsal archives and SBOM
        if: needs.plan.outputs.path == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-${{ needs.plan.outputs.version }}
          # These explicit evidence paths live beneath a hidden directory.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/release-*/release-manifest.json
            .artifacts/release-*/tarballs/*.tgz
            .artifacts/sbom-*/sbom.cdx.json
            .artifacts/rehearsal-notes.md
          retention-days: 7
      - name: Preserve selected rehearsal archives and compatibility result
        if: needs.plan.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-${{ needs.plan.outputs.artifact }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/full-release/release-manifest.json
            .artifacts/full-release/tarballs/*.tgz
            .artifacts/full-release/mixed-install-verification.json
            .artifacts/sbom-*/sbom.cdx.json
            .artifacts/rehearsal-notes.md
          retention-days: 7

  release:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.publish == 'true' && inputs.package_set != 'prerelease-22'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # Only the version tag and GitHub Release; version commits go through a reviewed PR.
      actions: read # Verify exact-main qualification and recover this run's immutable publication receipt.
      id-token: write # npm trusted publishing and provenance through OpenID Connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true # pushes only the version tag; never writes main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover this run's full-release archives and receipt
        id: recover
        if: github.run_attempt != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: .artifacts/full-release
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify the release archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          artifact_args=()
          if [ -n "$PLAN" ]; then
            node scripts/release-finalize.mjs --prepared-plan "$PLAN"
          else
            node scripts/release-finalize.mjs --prepared "$VERSION"
            artifact_args+=(--legacy-lockstep)
          fi
          pnpm build
          node scripts/secret-scan.mjs
          pnpm upgrade:compat --fetch-baseline
          pnpm release:artifacts "${artifact_args[@]}"
          node scripts/sbom.mjs
          mkdir -p .artifacts/full-release
          if [ ! -f .artifacts/full-release/sbom.cdx.json ]; then
            cp "$(find .artifacts -maxdepth 2 -name sbom.cdx.json ! -path '.artifacts/full-release/*' -print -quit)" .artifacts/full-release/sbom.cdx.json
          fi
          if [ ! -f .artifacts/full-release/release-notes.md ]; then
            if [ -n "$PLAN" ]; then
              node --input-type=module -e 'import {readReleasePlan} from "./scripts/package-release-plan.mjs"; console.log(readReleasePlan(process.argv[1]).plan.notes)' "$PLAN" > .artifacts/full-release/release-notes.md
            else
              node scripts/version.mjs notes "$VERSION" > .artifacts/full-release/release-notes.md
            fi
          fi
      - name: Publish to npm
        # npm exchanges this job's OIDC identity for package-scoped credentials. No npm token secret is required.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PLAN: ${{ needs.plan.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json ! -path '.artifacts/full-release/*' -print -quit)
          plan_args=()
          if [ -n "$PLAN" ]; then
            plan_args+=(--plan "$PLAN")
            if [ ! -f .artifacts/full-release/release-manifest.json ]; then
              node scripts/publish-staged.mjs --manifest "$manifest" --tag "$TAG" "${plan_args[@]}"
            fi
            node scripts/registry-release-check.mjs --manifest .artifacts/full-release/release-manifest.json "${plan_args[@]}" --staged
          fi
          node scripts/publish-staged.mjs --manifest "$manifest" --tag "$TAG" "${plan_args[@]}" --publish
      - name: Verify registry signatures and clean installation
        env:
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          plan_args=()
          if [ -n "$PLAN" ]; then plan_args+=(--plan "$PLAN"); fi
          node scripts/registry-release-check.mjs --manifest .artifacts/full-release/release-manifest.json "${plan_args[@]}"
      - name: Tag the qualified version commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLAN: ${{ needs.plan.outputs.path }}
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_GIT_COMMITTER_NAME || vars.RELEASE_GIT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_GIT_COMMITTER_EMAIL || vars.RELEASE_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          if [ -n "$PLAN" ]; then
            node scripts/release-finalize.mjs --published-plan "$PLAN"
            node --input-type=module -e 'import {readReleasePlan} from "./scripts/package-release-plan.mjs"; console.log(readReleasePlan(process.argv[1]).tags.join("\n"))' "$PLAN" > "$RUNNER_TEMP/mayura-release-tags"
          else
            node scripts/release-finalize.mjs --published "$VERSION"
            printf 'v%s\n' "$VERSION" > "$RUNNER_TEMP/mayura-release-tags"
          fi
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          refs=()
          while IFS= read -r release_tag; do
            ref="refs/tags/$release_tag"
            if git rev-parse -q --verify "$ref" > /dev/null; then
              test "$(git rev-parse "$ref^{commit}")" = "$SOURCE_SHA"
            else
              git tag -a "$release_tag" -m "Mayura release $release_tag"
            fi
            refs+=("$ref")
          done < "$RUNNER_TEMP/mayura-release-tags"
          git push --atomic origin "${refs[@]}"
          for ref in "${refs[@]}"; do
            test "$(git ls-remote origin "$ref^{}" | cut -f1)" = "$SOURCE_SHA"
          done

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLAN: ${{ needs.plan.outputs.path }}
        run: |
          if [ -n "$PLAN" ]; then
            node scripts/release-finalize.mjs --published-plan "$PLAN"
          else
            node scripts/release-finalize.mjs --published "$VERSION"
          fi
          IFS= read -r release_tag < "$RUNNER_TEMP/mayura-release-tags"
          staged=.artifacts/full-release
          assets=("$staged"/tarballs/*.tgz "$staged/release-manifest.json" "$staged/sbom.cdx.json" "$staged/receipt.json" "$staged/qualification.json" "$staged/registry-verification.json")
          if [ -n "$PLAN" ]; then assets+=("$staged/mixed-install-verification.json" "$PLAN"); fi
          # A release that already exists (a resumed run) keeps its notes and gets its files attached again.
          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            flags=()
            if [ "$TAG" = next ]; then flags+=(--prerelease); fi
            if [[ "$release_tag" == release/* ]]; then flags+=(--latest=false); fi
            gh release create "$release_tag" --verify-tag --title "Mayura $VERSION" --notes-file "$staged/release-notes.md" \
              "${flags[@]}" "${assets[@]}"
          fi
      - name: Preserve full-release evidence, including uncertain uploads
        # A failed/interrupted recovery must not replace the original evidence with a partial download.
        if: always() && (github.run_attempt == '1' || steps.recover.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          include-hidden-files: true
          path: |
            .artifacts/full-release/release-manifest.json
            .artifacts/full-release/receipt.json
            .artifacts/full-release/qualification.json
            .artifacts/full-release/registry-verification.json
            .artifacts/full-release/mixed-install-verification.json
            .artifacts/full-release/sbom.cdx.json
            .artifacts/full-release/release-notes.md
            .artifacts/full-release/tarballs/*.tgz
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  prerelease-22:
    name: Publish reviewed 22-package prerelease
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.package_set == 'prerelease-22' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      actions: read # Verify exact-main qualification and recover this run's receipt on retry.
      id-token: write # npm trusted publishing; no npm token secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0 # Upgrade compatibility needs the previous release tag and its tree.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
      - run: npm install --global npm@11.21.1 pnpm@10.17.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover this run's immutable archives and receipt
        if: github.run_attempt != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prerelease-22-${{ needs.plan.outputs.version }}
          path: .artifacts/prerelease-22
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify prerelease archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/version.mjs set "$VERSION" --lockstep
          pnpm build
          pnpm upgrade:compat --fetch-baseline
          pnpm release:artifacts --legacy-lockstep
          node scripts/sbom.mjs
      - name: Publish the reviewed set through OIDC and verify latest tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          manifest=$(find .artifacts -maxdepth 2 -name release-manifest.json ! -path '.artifacts/prerelease-22/*' -print -quit)
          node scripts/publish-prerelease.mjs --manifest "$manifest" --version "$VERSION" --publish
      - name: Preserve archives and receipt, including uncertain uploads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-22-${{ needs.plan.outputs.version }}
          include-hidden-files: true
          path: |
            .artifacts/prerelease-22/release-manifest.json
            .artifacts/prerelease-22/receipt.json
            .artifacts/prerelease-22/qualification.json
            .artifacts/prerelease-22/tarballs/*.tgz
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
