<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mayura · AG-UI notebook</title><link rel="stylesheet" href="/style.css"></head><body><main><small>MAYURA / LOCAL NOTEBOOK</small><h1>One conversation.<br>Every decision visible.</h1><p>Save a note with approval, then let the browser choose a theme. No external model or paid service.</p><section id="messages" role="log" aria-label="Conversation"></section><p id="status" role="status">Ready.</p><pre id="state" aria-label="Shared state"></pre><form id="composer"><label for="text">Your note</label><textarea id="text" maxlength="2000" required></textarea><button id="send">Send note</button></form><section id="approval" hidden><h2>Approve this exact request?</h2><pre id="proposal"></pre><button id="approve">Approve</button><button id="reject">Reject</button></section><button id="recover" hidden>Deliver saved browser result</button><button id="inspect" type="button">Inspect current run</button><button id="cancel" type="button">Cancel current run</button><pre id="run" aria-label="Run status"></pre><details><summary>Native thread history</summary><pre id="history"></pre></details></main><script type="module" src="/main.js"></script></body></html>
